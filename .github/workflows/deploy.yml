name: Deploy

on:
  push:
    branches:
      - staging
      - main

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          set -e

          if [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "app_dir=/home/pablo/proyectos/trackski/staging" >> "$GITHUB_OUTPUT"
            echo "project_name=trackski_staging" >> "$GITHUB_OUTPUT"
            echo "branch=staging" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "app_dir=/home/pablo/proyectos/trackski/main" >> "$GITHUB_OUTPUT"
            echo "project_name=trackski_main" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Deploy on MP100
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MP100_HOST }}
          username: ${{ secrets.MP100_USER }}
          port: ${{ secrets.MP100_PORT }}
          key: ${{ secrets.MP100_SSH_KEY }}
          script: |
            set -e

            APP_DIR="${{ steps.target.outputs.app_dir }}"
            PROJECT_NAME="${{ steps.target.outputs.project_name }}"
            BRANCH="${{ steps.target.outputs.branch }}"

            cd "$APP_DIR"

            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            docker network inspect proxy >/dev/null 2>&1 || docker network create proxy

            docker compose --env-file .env -p "$PROJECT_NAME" up -d --build
            docker compose --env-file .env -p "$PROJECT_NAME" --profile jobs run --rm data_job_roads || echo "WARNING: road data refresh failed"
            docker compose --env-file .env -p "$PROJECT_NAME" --profile jobs run --rm data_job_weather || echo "WARNING: weather data refresh failed"
            docker compose --env-file .env -p "$PROJECT_NAME" --profile jobs run --rm data_job_alerts || echo "WARNING: alert data refresh failed"

            docker image prune -f
