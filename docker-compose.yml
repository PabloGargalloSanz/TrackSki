x-job-environment: &job-environment
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  AEMET_API_KEY: ${AEMET_API_KEY:-}
  DGT_DATEX2_URL: ${DGT_DATEX2_URL}
  DGT_DATEX2_TIMEOUT_SECONDS: ${DGT_DATEX2_TIMEOUT_SECONDS}

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: ${DATABASE_URL}
      AEMET_API_KEY: ${AEMET_API_KEY:-}
      BACKEND_PORT: ${API_PORT}
    expose:
      - "${API_PORT}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.${APP_ENV}-backend.rule=Host(`${APP_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${APP_ENV}-backend.entrypoints=web"
      - "traefik.http.routers.${APP_ENV}-backend.priority=100"
      - "traefik.http.routers.${APP_ENV}-backend.middlewares=${TRAEFIK_BACKEND_MIDDLEWARES}"
      - "traefik.http.middlewares.${APP_ENV}-api-strip.stripprefix.prefixes=/api"

      - "traefik.http.services.${APP_ENV}-backend.loadbalancer.server.port=${API_PORT}"

  data_job_roads:
    build:
      context: ./backend
    profiles: ["jobs"]
    restart: "no"
    command: ["python", "-m", "app.jobs.refresh_real_data", "--roads"]
    environment: *job-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - job_egress

  data_job_weather:
    build:
      context: ./backend
    profiles: ["jobs"]
    restart: "no"
    command: ["python", "-m", "app.jobs.refresh_real_data", "--weather"]
    environment: *job-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - job_egress

  data_job_alerts:
    build:
      context: ./backend
    profiles: ["jobs"]
    restart: "no"
    command: ["python", "-m", "app.jobs.refresh_real_data", "--alerts"]
    environment: *job-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - job_egress

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT}
      PORT: ${FRONTEND_CONTAINER_PORT}
    expose:
      - "${FRONTEND_CONTAINER_PORT}"
    depends_on:
      - backend
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.${APP_ENV}-frontend.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.${APP_ENV}-frontend.entrypoints=web"
      - "traefik.http.routers.${APP_ENV}-frontend.priority=1"
      - "traefik.http.routers.${APP_ENV}-frontend.middlewares=${TRAEFIK_FRONTEND_MIDDLEWARES}"
      - "traefik.http.middlewares.${APP_ENV}-frontend-headers.headers.customrequestheaders.X-Forwarded-Proto=http"

      - "traefik.http.services.${APP_ENV}-frontend.loadbalancer.server.port=${FRONTEND_CONTAINER_PORT}"

networks:
  internal:
    internal: true
  job_egress:
  proxy:
    external: true

volumes:
  postgres_data:
